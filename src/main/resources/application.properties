spring.application.name=EcommerceApi
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgress}
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:local-dev-secret-key-that-is-at-least-32-characters-long}
server.port=${PORT:8080}
spring.jpa.show-sql=${SHOW_SQL:false}